name: Local Toolbox product CI

on:
  pull_request:
    branches:
      - main
      - codex/0.5.0
    paths:
      - 'product/**'
      - 'docs/architecture/**'
      - '.github/workflows/product-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Protect production update feed
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          CHANGED="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          if printf '%s\n' "$CHANGED" | grep -Eq '^(latest\.json|releases/)'; then
            echo 'Production latest.json/releases must not change in a normal development PR.' >&2
            printf '%s\n' "$CHANGED" | grep -E '^(latest\.json|releases/)' >&2 || true
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run integrated release-candidate regression gate
        shell: bash
        run: scripts/release-candidate-gate.sh
